<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roommate Finder</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

        <img src="logo_roommate.png" alt="logo" class="logo">

        <div class="nav-right">
            <input
                type="text"
                id="searchInput"
                class="searchBox"
                placeholder="ค้นหา..."
            >
            <select id="searchLocation">
                    <option value="">เลือกLocation</option>
                    <option value="มจพ.">มจพ.</option>
                    <option value="มจธ.">มจธ.</option>
                    <option value="สจล.">สจล.</option>
                    <option value="เกษตรศาสตร์.">เกษตรศาสตร์.</option>
            </select>

            <select id="searchGender">
                    <option value="">เลือกเพศ</option>
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
            </select>
            <button onclick="searchPost()">ค้นหา</button>


            <button class="createPost-btn">
                สร้างโพสต์
            </button>

            <button onclick="Logout()">Logout</button>
        </div>


    </nav>


    <div id="loginPage" class="login-page">

        <h2>Login</h2>
        <input type="text" id="usernameInput" placeholder="ใส่ชื่อผู้ใช้">
        <button onclick="login()">เข้าสู่ระบบ</button>

    </div>


    <section class="hero">


        <div id="modal" class="modal">
            <div class = "modal-content">

                <button id="closeModalBtn" class="closeModalBtn">
                    X
                </button>
                <p>กรุณากรอกข้อมูลหอพัก..</p>


                <div class="form-container"> 
                    
                    <input
                        type="text"
                        id="title"
                        placeholder="ชื่อหอพัก"
                    >

                    <input
                        type="text"
                        id="price"
                        placeholder="งบประมาณ"

                    >
                    <select id="location">
                        <option value="เลือกLocation">เลือกLocation</option>
                        <option value="มจพ.">มจพ.</option>
                        <option value="มจธ.">มจธ.</option>
                        <option value="สจล.">สจล.</option>
                        <option value="เกษตรศาสตร์.">เกษตรศาสตร์.</option>
                    </select>

                    <input
                        type="text"
                        id="distance"
                        placeholder="ระยะทางจากLocation (ไม่เกินกี่KM.)"
                    >

                    <select id="gender">
                        <option value="เลือกเพศ">เลือกเพศ</option>
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                    </select>

                    <input
                        type="text"
                        id="discription"
                        placeholder="รายละเอียด"
                    >
                    
                    <input
                        type="text"
                        id="contract"
                        placeholder="Phone / Line"
                    >

                    <input
                        type="file"
                        id="imageInput"
                    >
                </div>    
                <button onclick="addPost()">
                    +สร้างโพสต์
                </button>            

            </div>

        </div>



    </section>

    <section class="posts" id="posts">


    </section>

    <script src="script.js"></script>

</body>
</html>
